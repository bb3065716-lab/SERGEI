name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Copier le moteur hors-ligne (transformers.js + ONNX wasm)
        run: |
          mkdir -p www/ort
          cp node_modules/@huggingface/transformers/dist/transformers.min.js www/transformers.min.js
          find node_modules/onnxruntime-web/dist -name 'ort-wasm-simd-threaded*' \( -name '*.wasm' -o -name '*.mjs' \) -exec cp {} www/ort/ \; || true
          find node_modules/@huggingface/transformers/dist -name 'ort-wasm-simd-threaded*' \( -name '*.wasm' -o -name '*.mjs' \) -exec cp {} www/ort/ \; || true
          ls -la www/ort
      - run: npx cap add android
      - name: Autoriser le micro
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
      - run: npx capacitor-assets generate --android
        continue-on-error: true
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SergeiVsWalid-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
